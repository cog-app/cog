stages:
  - test
  - build
  - deploy

# interruptible below only takes effect if pipelines are actually
# auto-cancelled. Declared in-file rather than relying on the project's
# "Auto-cancel redundant pipelines" toggle, so it is version controlled.
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

test:
  image: golang:1.26-alpine
  stage: test
  before_script:
    # chromium runs the browser tests, which otherwise skip themselves and
    # leave every page in the app untested here. Safe to run in CI because a
    # snapshot asserts on the DOM: the runner's browser build no longer has to
    # match the one that produced the goldens.
    - apk add --no-cache gcc musl-dev chromium
  script:
    - CGO_ENABLED=1 go generate ./...
    - CGO_ENABLED=1 go test ./...

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE" .
    - docker push "$CI_REGISTRY_IMAGE"

pages:
  image: golang:1.26-alpine
  stage: build
  before_script:
    - apk add --no-cache gcc musl-dev
  script:
    - CGO_ENABLED=1 go tool docs
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trigger_deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  trigger:
    project: jonathan/home.duckfam.us
