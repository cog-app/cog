stages:
  - test
  - build
  - deploy

# interruptible below only takes effect if pipelines are actually
# auto-cancelled. Declared in-file rather than relying on the project's
# "Auto-cancel redundant pipelines" toggle, so it is version controlled.
#
# Pipelines run for merge requests and on master, and not for a push to a
# branch: a branch with a merge request would otherwise run two per push.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true

variables:
  # The test and pages jobs run in $CI_REGISTRY_IMAGE/ci, built from the
  # Dockerfile's ci stage. master's is tagged latest; a merge request that
  # changes what goes into it builds its own, tagged with its source branch
  # (.ci-image-changes).
  CI_IMAGE_TAG: latest
  # Inside the project directory, which is the only place GitLab caches.
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest

# When the CI image has to be rebuilt: on master when a push changed its
# inputs, and in a merge request whose inputs differ from master's at all, so
# every pipeline of that merge request, not only the push that changed them,
# uses its own, tagged with the source branch (CI_COMMIT_REF_SLUG).
.ci-image-changes:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    changes: &ci-image-inputs
      - Dockerfile
      - go.mod
      - go.sum
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths: *ci-image-inputs
      compare_to: refs/heads/master
    variables:
      CI_IMAGE_TAG: $CI_COMMIT_REF_SLUG

# The Go build cache, which also holds test results: go test replays a
# package's passing result while nothing it depends on has changed, so a
# pipeline only runs the tests a change can affect. Entries are addressed
# by content, so every branch shares one cache. go tool stamp keeps the
# files tests read from looking changed in every fresh checkout.
.go-cache: &go-cache
  key: go-build
  paths:
    - .cache/go-build

ci-image:
  stage: .pre
  rules:
    - !reference [.ci-image-changes]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build --target ci -t "$CI_REGISTRY_IMAGE/ci:$CI_IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/ci:$CI_IMAGE_TAG"

test:
  image: $CI_REGISTRY_IMAGE/ci:$CI_IMAGE_TAG
  stage: test
  needs:
    - job: ci-image
      optional: true
  rules:
    - !reference [.ci-image-changes]
    - when: on_success
  cache:
    <<: *go-cache
    # A failed run still compiled everything and passed most packages.
    when: always
  script:
    - go generate ./...
    - go tool stamp
    # A package's browser tests wait for a Chrome slot (WEBTEST_PARALLEL,
    # CLAUDE.md) while other packages hold them, and the wait counts against
    # go test's per-package timeout.
    - nproc
    - go test -timeout 30m ./...
  artifacts:
    # A failing snapshot writes <TestName>.actual.html and .png beside its
    # golden; without them a CI-only difference can't be read.
    when: on_failure
    expire_in: 1 week
    paths:
      - "**/testdata/snapshots/*.actual.*"

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE" .
    - docker push "$CI_REGISTRY_IMAGE"

pages:
  image: $CI_REGISTRY_IMAGE/ci:$CI_IMAGE_TAG
  stage: build
  cache:
    <<: *go-cache
    policy: pull
  script:
    - go tool docs
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trigger_deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  trigger:
    project: jonathan/home.duckfam.us
