            Tags

            + New Bookmark
          </a>
        </nav>
        <div class="sidebar-content">
          <div class="flex items-center gap-1 mb-2" style="justify-content:space-between">
            <h1 style="margin:0">
              All Bookmarks
            </h1>
            <a class="btn btn-primary btn-sm" href="/apps/bookmarks/new">
              Add Bookmark
            </a>
          </div>
          <form action="/apps/bookmarks/" class="mb-2" method="get">
            <div class="flex gap-1">
              <input class="form-control" name="q" placeholder="Search bookmarks..." style="max-width:400px" type="text" value="" />
              <button class="btn btn-outline btn-sm" type="submit">
                Search
              </button>
            </div>
          </form>
          <div id="bookmark-list">
            <div id="bm-1" style="padding:0.75rem 1rem;border-bottom:1px solid var(--color-border, #e0e0e0);display:flex;align-items:center;justify-content:space-between;gap:0.5rem">

                <div class="flex items-center gap-1" style="flex-wrap:wrap">
                  <a href="/apps/bookmarks/bookmark/1" style="font-weight:500">
                    Tagged BM
                  </a>
                </div>
                <div class="text-muted" style="font-size:0.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  example.com · testtag
                </div>
              </div>
              <div class="flex gap-1" style="flex-shrink:0">
                <form action="/apps/bookmarks/bookmarks/1/click" method="post" style="display:inline" target="_blank">
                  <input name="csrf_token" type="hidden" value="«hex»" />
                  <button class="btn btn-outline btn-sm" title="Open & track click" type="submit">
                    ↗
                  </button>
                </form>
                <button class="btn btn-danger btn-sm" hx-confirm="Delete this bookmark?" hx-delete="/apps/bookmarks/bookmarks/1" hx-swap="outerHTML" hx-target="#bm-1">
                  ✕
                </button>
              </div>
            </div>
          </div>
        </div>
