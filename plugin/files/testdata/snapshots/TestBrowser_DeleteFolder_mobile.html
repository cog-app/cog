        <button class="apps-toggle" type="button">

            <rect height="7" width="7" x="14" y="14" />
          </svg>
        </button>
        <div class="dropdown-menu apps-menu">
          <a class="active" href="/apps/files">
            <svg class="nav-icon" viewBox="0 0 24 24">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />

              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Dashboard
          </a>
        </div>
      </div>
      <div class="navbar-search">
        <input autocomplete="off" class="form-control search-input" hx-get="/api/search/partial" hx-target="#search-results" hx-trigger="input changed delay:200ms, search" id="search-box" name="q" placeholder="Search (/)..." type="search" />
        <div class="search-results" id="search-results" />
      </div>
      <div class="navbar-end">
        <div id="notif-bell" onclick="toggleNotifPanel()" style="position:relative;cursor:pointer;padding:0 0.5rem;display:none" title="Notifications">
          <svg fill="none" height="20" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" stroke="currentColor" viewBox="0 0 24 24" width="20">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="notif-badge" id="notif-badge" style="display:none" />
        </div>
        <div class="dropdown-menu" id="notif-panel" style="display:none;position:absolute;right:4rem;top:3rem;min-width:280px;max-height:300px;overflow:auto;z-index:100" />
        <div class="dropdown" tabindex="0">
          <button class="dropdown-toggle" type="button">
            <img class="avatar-sm" src="/avatar/«hex»" />
            <span class="dropdown-username">
              delete
            </span>
            <span class="dropdown-caret">
              ▾
            </span>
          </button>
          <div class="dropdown-menu">
            <a class="" href="/settings/profile">
              Profile
            </a>
            <a class="" href="/settings/security">
              Security
            </a>
            <a class="" href="/settings/storage">
              Storage
            </a>
            <a class="" href="/settings/groups">
              Groups
            </a>
            <div class="dropdown-divider" />
            <form action="/logout" method="post">
              <input name="csrf_token" type="hidden" value="«hex»" />
              <button onmousedown="this.closest('form').submit()" type="submit">
                Log out
              </button>
            </form>
          </div>
        </div>
      </div>

    <main class="content" data-plugin="files">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.5rem">
        <h1 style="margin:0">
          Files
        </h1>
        <a class="btn btn-outline btn-sm" href="/apps/files/favorites">
          Favorites
        </a>
        <a class="btn btn-outline btn-sm" href="/apps/files/volumes">
          Volumes
        </a>
      </div>
      <nav style="margin-bottom:1rem">
        <a href="/apps/files/">
          root
        </a>
      </nav>
      <div class="card">
        <div class="flex gap-1 items-end mb-2" style="flex-wrap:wrap">
          <form action="/apps/files/" class="flex gap-1 items-end" method="post">
            <input name="csrf_token" type="hidden" value="«hex»" />
            <input class="form-control" data-testid="new-folder-name" name="name" placeholder="New folder" required="" style="max-width:200px" type="text" />
            <button class="btn btn-outline btn-sm" data-testid="new-folder-submit" type="submit">
              Create Folder
            </button>
          </form>
          <form action="/apps/files/" enctype="multipart/form-data" method="post" style="display:inline">
            <input name="csrf_token" type="hidden" value="«hex»" />
            <label class="btn btn-primary btn-sm" style="cursor:pointer">
              Upload
              <input accept="" multiple="" name="file" onchange="this.form.submit()" style="display:none" type="file" />
            </label>
          </form>
          <button class="btn btn-danger btn-sm" id="bulk-delete-btn" onclick="bulkDelete()" style="display:none">
            Delete Selected
          </button>
        </div>
        <div id="drop-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,100,200,0.15);z-index:1000;pointer-events:none;border:3px dashed var(--color-primary,#0082c9);margin:8px">
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5rem;font-weight:600;color:var(--color-primary,#0082c9);background:var(--color-bg,#fff);padding:1rem 2rem;border-radius:8px">
            Drop files to upload
          </div>
        </div>
        <table class="table" id="files-table">
          <thead>
            <tr>
              <th style="width:2rem">
                <input id="select-all" onchange="toggleSelectAll(this)" type="checkbox" />
              </th>
              <th>
                Name
              </th>
              <th>
                Size
              </th>
              <th>
                Modified
              </th>
              <th class="text-right">
                Actions
              </th>
            </tr>
          </thead>
          <tbody />
        </table>
      </div>
    </main>
  </body>
