        <div class="sidebar-content">
          <div class="flex items-center gap-1 mb-2" style="justify-content:space-between">
            <h1 style="margin:0">
              Contacts
            </h1>
            <button class="btn btn-primary" onclick="document.getElementById('create-contact-modal').style.display='flex'">
              New Contact
            </button>
          </div>
          <div class="card">
            <p class="text-muted">
              No contacts yet. Create one or sync with a CardDAV client.
            </p>
          </div>
        </div>

      <div class="modal-overlay" id="contact-modal" onclick="if(event.target===this)this.style.display='none'" style="display:none">
        <div class="modal-content" id="contact-modal-body" />
      </div>
      <div class="modal-overlay" id="create-contact-modal" onclick="if(event.target===this)this.style.display='none'" style="display:none">
        <div class="modal-content">
          <h2 style="margin-top:0">
            New Contact
          </h2>
          <form action="/apps/contacts/contacts" method="post">
            <input name="csrf_token" type="hidden" value="«hex»" />
            <div class="form-group">
              <label for="cc-book">
                Address Book
              </label>
              <select class="form-control" id="cc-book" name="address_book_id">
                <option value="1">
                  Contacts
                </option>
              </select>
            </div>
            <div class="flex gap-1">
              <div class="form-group" style="flex:1">
                <label for="cc-given">
                  First name
                </label>
                <input class="form-control" id="cc-given" name="given" type="text" />
              </div>
              <div class="form-group" style="flex:1">
                <label for="cc-family">
                  Last name
                </label>
                <input class="form-control" id="cc-family" name="family" type="text" />
              </div>
            </div>
            <div class="form-group">
              <label for="cc-fn">
                Display name
              </label>
              <input class="form-control" id="cc-fn" name="fn" placeholder="First and last name" type="text" />
            </div>
            <fieldset style="border:1px solid var(--color-border, #ddd);border-radius:var(--radius, 6px);padding:0.75rem;margin-bottom:1rem">
              <legend style="font-weight:500;font-size:0.9rem">
                Emails
              </legend>
              <div id="cc-emails">
                <div class="flex gap-1 items-end mb-1">
                  <input name="email_index" type="hidden" value="new" />
                  <select class="form-control" name="email_type" style="width:100px">
                    <option selected="" value="INTERNET">
                      Personal
                    </option>
                    <option value="WORK">
                      Work
                    </option>
                    <option value="HOME">
                      Home
                    </option>
                  </select>
                  <input class="form-control" name="email_value" placeholder="email@example.com" style="flex:1" type="email" value="" />
                </div>
              </div>
              <button class="btn btn-outline btn-sm" onclick="addField('cc-emails','email')" type="button">
                + Add email
              </button>
            </fieldset>
            <fieldset style="border:1px solid var(--color-border, #ddd);border-radius:var(--radius, 6px);padding:0.75rem;margin-bottom:1rem">
              <legend style="font-weight:500;font-size:0.9rem">
                Phones
              </legend>
              <div id="cc-phones">
                <div class="flex gap-1 items-end mb-1">
                  <input name="phone_index" type="hidden" value="new" />
                  <select class="form-control" name="phone_type" style="width:100px">
                    <option selected="" value="CELL">
                      Cell
                    </option>
                    <option value="WORK">
                      Work
                    </option>
                    <option value="HOME">
                      Home
                    </option>
                    <option value="FAX">
                      Fax
                    </option>
                  </select>
                  <input class="form-control" name="phone_value" placeholder="+1 555-1234" style="flex:1" type="tel" value="" />
                </div>
              </div>
              <button class="btn btn-outline btn-sm" onclick="addField('cc-phones','phone')" type="button">
                + Add phone
              </button>
            </fieldset>
            <fieldset style="border:1px solid var(--color-border, #ddd);border-radius:var(--radius, 6px);padding:0.75rem;margin-bottom:1rem">
              <legend style="font-weight:500;font-size:0.9rem">
                Work
              </legend>
              <div class="form-group">
                <label for="cc-org">
                  Organization
                </label>
                <input class="form-control" id="cc-org" name="org" type="text" />
              </div>
              <div class="form-group">
                <label for="cc-title">
                  Title
                </label>
                <input class="form-control" id="cc-title" name="title" type="text" />
              </div>
            </fieldset>
            <div class="form-group">
              <label for="cc-note">
                Note
              </label>
              <textarea class="form-control" id="cc-note" name="note" rows="3" />
            </div>
            <div class="flex gap-1" style="justify-content:flex-end">
              <button class="btn" onclick="document.getElementById('create-contact-modal').style.display='none'" type="button">
                Cancel
              </button>
              <button class="btn btn-primary" type="submit">
                Create
              </button>
            </div>
          </form>
        </div>
      </div>
