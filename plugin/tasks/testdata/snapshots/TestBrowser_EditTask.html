    <main class="content" data-plugin="tasks">
      <div class="sidebar-layout">
        <nav class="sidebar" id="tasks-sidebar">
          <a class="sidebar-item active" href="/apps/tasks/list/2">
            <span class="sidebar-color-dot" style="background:#43a047;" />
            Home Renovation
          </a>
          <a class="sidebar-item" href="/apps/tasks/list/1">
            <span class="sidebar-color-dot" style="background:#0082c9;" />
            Personal
          </a>
          <div class="sidebar-divider" />
          <form action="/apps/tasks/list" class="flex gap-1 items-center" method="post" style="padding:0.5rem 1rem">
            <input name="csrf_token" type="hidden" value="«hex»" />
            <input class="form-control" data-testid="new-list-name" name="name" placeholder="New list..." required="" style="flex:1;min-width:0" type="text" />
            <button class="btn btn-outline btn-sm" data-testid="new-list-submit" type="submit">
              +
            </button>
          </form>
        </nav>
        <div class="sidebar-content">
          <h1>
            Edit Task
          </h1>
          <div class="card">
            <form action="/apps/tasks/task/2" method="post">
              <input name="csrf_token" type="hidden" value="«hex»" />
              <div class="form-group">
                <label for="summary">
                  Summary
                </label>
                <input class="form-control" id="summary" name="summary" required="" type="text" value="Choose paint colours" />
              </div>
              <div class="form-group">
                <label for="description">
                  Description
                </label>
                <textarea class="form-control" id="description" name="description" rows="4">
                  Sample pots from the shop on Elm Street; compare in daylight.
                </textarea>
              </div>
              <div class="flex gap-1" style="flex-wrap:wrap">
                <div class="form-group" style="flex:1;min-width:200px">
                  <label for="list_id">
                    List
                  </label>
                  <select class="form-control" id="list_id" name="list_id">
                    <option selected="" value="2">
                      Home Renovation
                    </option>
                    <option value="1">
                      Personal
                    </option>
                  </select>
                </div>
                <div class="form-group" style="flex:1;min-width:200px">
                  <label for="parent_id">
                    Parent Task
                  </label>
                  <select class="form-control" id="parent_id" name="parent_id">
                    <option value="">
                      (none)
                    </option>
                    <option selected="" value="1">
                      Kitchen
                    </option>
                    <option value="3">
                      Order sample pots
                    </option>
                    <option value="4">
                      Get three quotes for new cabinets
                    </option>
                    <option value="5">
                      Measure the windows
                    </option>
                    <option value="7">
                      Call the electrician about rewiring the upstairs bedrooms before the plasterer arrives, and ask whether the old fuse box needs replacing too
                    </option>
                    <option value="8">
                      Pick up tiles
                    </option>
                  </select>
                </div>
              </div>
              <div class="flex gap-1" style="flex-wrap:wrap">
                <div class="form-group" style="flex:1;min-width:150px">
                  <label for="priority">
                    Priority (0-9)
                  </label>
                  <input class="form-control" id="priority" max="9" min="0" name="priority" type="number" value="5" />
                </div>
                <div class="form-group" style="flex:1;min-width:150px">
                  <label for="status">
                    Status
                  </label>
                  <select class="form-control" id="status" name="status">
                    <option selected="" value="NEEDS-ACTION">
                      NEEDS-ACTION
                    </option>
                    <option value="IN-PROCESS">
                      IN-PROCESS
                    </option>
                    <option value="COMPLETED">
                      COMPLETED
                    </option>
                    <option value="CANCELLED">
                      CANCELLED
                    </option>
                  </select>
                </div>
                <div class="form-group" style="flex:1;min-width:150px">
                  <label for="percent_complete">
                    % Complete
                  </label>
                  <input class="form-control" id="percent_complete" max="100" min="0" name="percent_complete" type="number" value="0" />
                </div>
              </div>
              <div class="flex gap-1" style="flex-wrap:wrap">
                <div class="form-group" style="flex:1;min-width:200px">
                  <label for="due_at">
                    Due Date (UTC)
                  </label>
                  <input class="form-control" id="due_at" name="due_at_date" type="datetime-local" value="2025-03-10T00:00" />
                </div>
                <div class="form-group" style="flex:1;min-width:200px">
                  <label for="start_at">
                    Start Date (UTC)
                  </label>
                  <input class="form-control" id="start_at" name="start_at_date" type="datetime-local" value="" />
                </div>
              </div>
              <div class="flex gap-1">
                <button class="btn btn-primary" type="submit">
                  Save
                </button>
                <a class="btn btn-outline" href="/apps/tasks/list/2">
                  Cancel
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
