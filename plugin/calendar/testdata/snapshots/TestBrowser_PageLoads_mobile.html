        <div class="modal-content">

          </h2>
          <form action="/apps/calendar/events" id="create-event-form" method="post" onsubmit="clearColorIfUnchecked('ce-color-enable','ce-color')">
            <input name="csrf_token" type="hidden" value="«hex»" />
            <div class="form-group">
              <label for="ce-calendar">
                Calendar
              </label>
              <select class="form-control" id="ce-calendar" name="calendar_id" onchange="syncCalColor(this,'ce-color','ce-color-enable')">
                <option data-color="#0082c9" value="1">
                  Personal
                </option>
              </select>
            </div>
            <div class="form-group">
              <label for="ce-summary">
                Title
              </label>
              <input class="form-control" id="ce-summary" name="summary" required="" type="text" />
            </div>
            <div class="form-group">
              <label>
                <input id="ce-allday" name="all_day" type="checkbox" />
                All day
              </label>
            </div>
            <div id="ce-datetime-fields">
              <div class="form-group">
                <label for="ce-start">
                  Start
                </label>
                <input class="form-control" id="ce-start" name="datetime_start" required="" type="datetime-local" />
              </div>
              <div class="form-group">
                <label for="ce-end">
                  End
                </label>
                <input class="form-control" id="ce-end" name="datetime_end" type="datetime-local" />
              </div>
            </div>
            <div id="ce-date-fields" style="display:none">
              <div class="form-group">
                <label for="ce-date-start">
                  Start Date
                </label>
                <input class="form-control" id="ce-date-start" name="date_start" type="date" />
              </div>
              <div class="form-group">
                <label for="ce-date-end">
                  End Date
                </label>
                <input class="form-control" id="ce-date-end" name="date_end" type="date" />
              </div>
            </div>
            <div class="form-group">
              <label for="ce-location">
                Location
              </label>
              <input class="form-control" id="ce-location" name="location" type="text" />
            </div>
            <div class="form-group">
              <label for="ce-description">
                Description
              </label>
              <textarea class="form-control" id="ce-description" name="description" rows="3" />
            </div>

                  Daily
                </option>

                  Weekly
                </option>
                <option value="MONTHLY">
                  Monthly
                </option>
                <option value="YEARLY">
                  Yearly
                </option>
                <option value="CUSTOM">
                  Custom…
                </option>
              </select>
            </div>
            <div id="ce-rrule-opts" style="display:none">
              <div class="form-group">
                <label for="ce-interval">
                  Every
                </label>
                <input class="form-control" id="ce-interval" min="1" name="rrule_interval" style="max-width:100px" type="number" value="1" />
              </div>
              <div class="form-group" id="ce-byday" style="display:none">
                <label>
                  On days
                </label>
                <div class="flex gap-1" style="flex-wrap:wrap">
                  <label style="font-size:0.85rem;font-weight:normal">
                    <input name="rrule_byday" type="checkbox" value="MO" />
                    Mon
                  </label>
                  <label style="font-size:0.85rem;font-weight:normal">
                    <input name="rrule_byday" type="checkbox" value="TU" />
                    Tue
                  </label>
                  <label style="font-size:0.85rem;font-weight:normal">
                    <input name="rrule_byday" type="checkbox" value="WE" />
                    Wed
                  </label>
                  <label style="font-size:0.85rem;font-weight:normal">
                    <input name="rrule_byday" type="checkbox" value="TH" />
                    Thu
                  </label>
                  <label style="font-size:0.85rem;font-weight:normal">
                    <input name="rrule_byday" type="checkbox" value="FR" />
                    Fri
                  </label>
                  <label style="font-size:0.85rem;font-weight:normal">
                    <input name="rrule_byday" type="checkbox" value="SA" />
                    Sat
                  </label>
                  <label style="font-size:0.85rem;font-weight:normal">
                    <input name="rrule_byday" type="checkbox" value="SU" />
                    Sun
                  </label>
                </div>
              </div>
              <div class="form-group">
                <label for="ce-until">
                  Until (optional)
                </label>
                <input class="form-control" id="ce-until" name="rrule_until" style="max-width:200px" type="date" />
              </div>
            </div>
            <div id="ce-rrule-custom" style="display:none">
              <div class="form-group">
                <label for="ce-rrule">
                  Custom RRULE
                </label>
                <input class="form-control" hx-get="/apps/calendar/rrule-preview" hx-target="#ce-rrule-desc" hx-trigger="input changed delay:300ms" id="ce-rrule" name="rrule" placeholder="e.g. FREQ=WEEKLY;BYDAY=MO,WE,FR;COUNT=10" type="text" />
                <div class="text-muted" id="ce-rrule-desc" style="font-size:0.85rem;margin-top:0.25rem" />
              </div>
            </div>
            <div class="form-group">
              <label>
                Attendees
              </label>
              <div id="ce-attendees" />
              <button class="btn btn-sm" onclick="addAttendeeRow('ce-attendees')" type="button">
                Add attendee
              </button>
            </div>
            <div class="form-group">
              <label for="ce-color">
                Event Color
              </label>
              <div class="flex gap-1 items-center">
                <input class="form-control" id="ce-color" name="color" style="width:60px;padding:2px" type="color" value="#0082c9" />
                <label style="font-size:0.8rem;font-weight:normal">
                  <input id="ce-color-enable" onchange="handleColorToggle(this,'ce-color','ce-calendar')" type="checkbox" />
                  Custom color
                </label>
              </div>
            </div>
            <div class="flex gap-1" style="justify-content:flex-end">
              <button class="btn" onclick="document.getElementById('create-modal').style.display='none'" type="button">
                Cancel
              </button>
              <button class="btn btn-primary" type="submit">
                Create
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
