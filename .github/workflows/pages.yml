# Publishes the docs site. The site lives in its own repository
# (cog-app/cog-app.github.io, served at https://cog-app.github.io from its
# main branch), so this builds it here and pushes it there with a deploy
# key (PAGES_DEPLOY_KEY).
#
# The site also serves releases.json and its signature: the list of
# releases the updater in every installed Cog reads (internal/update). Only
# the release workflow signs one, and passes it here (release_list); a push
# to master keeps the one the site has. This workflow never sees the
# signing key.
name: Pages

on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      release_list:
        description: publish the release list the calling release run signed
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_REPO: cog-app/cog-app.github.io

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Docs
        run: go run ./cmd/cog docs --out public
      - name: Release list
        if: ${{ inputs.release_list }}
        uses: actions/download-artifact@v4
        with:
          name: release-list
          path: public
      - name: Push the site
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PAGES_DEPLOY_KEY" > ~/.ssh/pages
          chmod 600 ~/.ssh/pages
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/pages -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:$SITE_REPO.git" site
          # releases.json is only replaced by one in public/, which only a
          # release run puts there.
          rsync -a --delete --exclude .git --exclude 'releases.json*' public/ site/
          if [ -f public/releases.json ]; then
            cp public/releases.json public/releases.json.sig site/
          fi
          touch site/.nojekyll
          cd site
          git add -A
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git -c user.name="cog release" -c user.email="actions@users.noreply.github.com" \
            commit -m "Publish ${GITHUB_SHA::12}"
          git push
