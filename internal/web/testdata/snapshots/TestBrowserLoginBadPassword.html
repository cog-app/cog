<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport" />
    <title>
      Login — Cog
    </title>
    <link href="/static/style.css?v=896ce6a8a2ed" rel="stylesheet" />
    <link href="/static/favicon.svg?v=f043627311df" rel="icon" type="image/svg+xml" />
  </head>
  <body>
    <div class="login-container">
      <div class="card login-card">
        <div class="login-title">
          <svg fill="none" height="28" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" stroke="currentColor" style="vertical-align:middle" viewBox="0 0 24 24" width="28">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          Cog
        </div>
        <div class="alert alert-error" style="position:relative">
          <button aria-label="Close" class="alert-dismiss" onclick="this.parentElement.remove()" type="button">
            ×
          </button>
          Invalid username or password.
        </div>
        <form action="/login" method="post">
          <div class="form-group">
            <label for="username">
              Username
            </label>
            <input autofocus="" class="form-control" id="username" name="username" required="" type="text" value="" />
          </div>
          <div class="form-group">
            <label for="password">
              Password
            </label>
            <input class="form-control" id="password" name="password" required="" type="password" value="" />
          </div>
          <button class="btn btn-primary" style="width:100%;margin-top:0.5rem" type="submit">
            Log in
          </button>
          <div style="text-align:right;margin-top:0.5rem">
            <a href="/forgot-password" style="font-size:0.875rem">
              Forgot password?
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
