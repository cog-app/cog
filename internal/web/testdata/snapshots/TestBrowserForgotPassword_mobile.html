<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>
      Forgot password — Cog
    </title>
    <link href="/static/style.css?v=7d69d7d9e500" rel="stylesheet" />
    <link href="/static/favicon.svg?v=f043627311df" rel="icon" type="image/svg+xml" />
  </head>
  <body>
    <main class="login-container">
      <div class="card login-card">
        <a class="login-title" href="/">
          <svg aria-hidden="true" fill="none" height="28" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" stroke="currentColor" viewBox="0 0 24 24" width="28">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span>
            Cog
          </span>
        </a>
        <h1 class="login-heading">
          Reset your password
        </h1>
        <p class="login-lead">
          Enter your username or email and we'll send you a link to choose a new password.
        </p>
        <form action="/forgot-password" method="post">
          <div class="form-group">
            <label for="identifier">
              Username or email
            </label>
            <input autocapitalize="none" autocomplete="username" autofocus="" class="form-control" id="identifier" name="identifier" required="" type="text" />
          </div>
          <button class="btn btn-primary btn-block" type="submit">
            Send reset link
          </button>
        </form>
        <p class="login-footer">
          <a href="/login">
            Back to login
          </a>
        </p>
      </div>
    </main>
  </body>
</html>
