    <style>
      .htmx-indicator{opacity:0} .htmx-request .htmx-indicator{opacity:1; transition: opacity 200ms ease-in;} .htmx-request.htmx-indicator{opacity:1; transition: opacity 200ms ease-in;}

  <body>
    <main class="content setup">
      <p class="steps">
        Step 1 of 6
      </p>
      <h1 class="question">
        How should Cog run?
      </h1>
      <p class="lead">
        Most people run Cog on a computer at home. You can change this later by running setup again.
      </p>
      <form action="/step/run" method="post">
        <label class="choice">
          <input checked="" name="scope" type="radio" value="user" />
          <strong>
            On this computer, for me
          </strong>
          <span class="form-help">
            Cog starts when you sign in and runs as you. No administrator rights needed. The right choice for a home computer or laptop.
          </span>
        </label>
        <label class="choice">
          <input name="scope" type="radio" value="system" />
          <strong>
            As a server
          </strong>
          <span class="form-help">
            Cog starts with the computer, before anyone signs in, and runs as an account of its own. Needs administrator rights.
          </span>
        </label>
        <p class="form-help when when-system">
          Setup is running with administrator rights.
        </p>
        <div class="wizard-actions">
          <span class="spacer" />
          <button class="btn btn-primary" type="submit">
            Continue
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
